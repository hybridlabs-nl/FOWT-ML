# This workflow builds the Python package when a release is created (or when triggered manually).
# It does not publish to PyPI, see https://github.com/hybridlabs-nl/FOWT-ML/issues/61
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# TODO: re-add the PyPI publish step (`pypa/gh-action-pypi-publish` with the `PYPI_API_TOKEN` secret) once the package is ready for deployment

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        pip install build
    - name: Build package
      run: python -m build
